networks:
  nginx:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/28
          gateway: 172.24.0.1

services:

  lb:
    image: traefik:v2.10
    container_name: traefik-lb
    ports:
      - "80:80"
      - "443:443" 
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - ./traefik/certs:/etc/traefik/certs:ro
      - ./traefik/pass:/etc/traefik/pass:ro
    networks:
      nginx:
        ipv4_address: 172.24.0.2    
    restart: always

  app1:
    image: nginx:alpine
    container_name: nginx-app1
    volumes:
      - ./app1/default.conf:/etc/nginx/conf.d/default.conf:ro  
      - ./app1/index.html:/usr/share/nginx/html/index.html:ro  
    networks:
      nginx:
        ipv4_address: 172.24.0.3
  app2:
    image: nginx:alpine
    container_name: nginx-app2
    volumes:
      - ./app2/default.conf:/etc/nginx/conf.d/default.conf:ro  
      - ./app2/index.html:/usr/share/nginx/html/index.html:ro  
    networks:
      nginx:
        ipv4_address: 172.24.0.4
  curl:
    image: curlimages/curl
    container_name: curlbox
    command: ["sleep", "infinity"]
    networks:
      nginx:
        ipv4_address: 172.24.0.5