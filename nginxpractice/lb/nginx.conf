worker_processes 1;

events {
	worker_connections 1024;
	}

http {
	limit_req_zone $binary_remote_addr zone=rl_zone:10m rate=10r/s;
	limit_conn_zone $binary_remote_addr zone=addr_zone:10m;
	map $http_upgrade $connection_upgrade {
		default close;
		websocket upgrade;
	}
	upstream app_backend {
	#ip_hash;
		server nginx-app1:80 weight=1;
		server nginx-app2:80 weight=1;
	}
	server {
		listen 80;
		server_name lb.nginx;
		return 301 https://$host$request_uri;

	#location / {
	#proxy_pass http://app_backend;
	#proxy_set_header Host $host;
	}
	server {
		listen 443 ssl;
		server_name lb.nginx;

		ssl_certificate /etc/nginx/certs/lb.nginx.crt;	
		ssl_certificate_key /etc/nginx/certs/lb.nginx.key;

		client_max_body_size 20m;

		error_page 403 404 500 502 503 504 /error.html;
		location = /error.html { internal;
		 root /etc/nginx;
		 }

		auth_basic "ATTENTION";
		auth_basic_user_file /etc/nginx/pass;

		location /home/ {
			proxy_pass http://app_backend;

		#allow 172.24.0.5;
		#deny all;
			
			proxy_http_version 1.1;	

			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		
		}
		
		}
}
