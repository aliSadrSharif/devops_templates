networks:
  nginx:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/28
          gateway: 172.24.0.1

services:

  lb:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "80:80"
      - "443:443" 
    volumes:
      - ./lb/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./lb/certs:/etc/nginx/certs:ro
      - ./lb/pass:/etc/nginx/pass:ro 
      - ./lb/error.html:/etc/nginx/error.html:ro
    networks:
      nginx:
        ipv4_address: 172.24.0.2    
    restart: always

  app1:
    image: nginx:alpine
    container_name: nginx-app1
    volumes:
      - ./app1/default.conf:/etc/nginx/conf.d/default.conf:ro  
      - ./app1/index.html:/usr/share/nginx/html/index.html:ro  
    networks:
      nginx:
        ipv4_address: 172.24.0.3
  app2:
    image: nginx:alpine
    container_name: nginx-app2
    volumes:
      - ./app2/default.conf:/etc/nginx/conf.d/default.conf:ro  
      - ./app2/index.html:/usr/share/nginx/html/index.html:ro  
    networks:
      nginx:
        ipv4_address: 172.24.0.4
  curl:
    image: curlimages/curl
    container_name: curlbox
    command: ["sleep", "infinity"]
    networks:
      nginx:
        ipv4_address: 172.24.0.5