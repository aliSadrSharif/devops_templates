global
    log stdout format raw local0
    maxconn 2000
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    timeout connect 5s
    timeout client  50s
    timeout server  50s

backend http_back
    balance roundrobin
    server app1     localhost:9080 check

frontend http_front
    bind *:9095
    default_backend http_back

listen stats
    bind    *:8404
    mode    http
    stats   enable
    stats   uri /haproxy?stats
    stats   refresh 10s
    stats   auth admin:admin
    stats   show-legends